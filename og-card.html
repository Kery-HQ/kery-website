<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kery — OG Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Outfit:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #fbf7ea;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
    }

    /* ── Card ── */
    #card {
      width: 1200px;
      height: 630px;
      background: #fbf7ea;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* Mango grove — right side */
    .grove {
      position: absolute;
      right: 0;
      top: 0;
      width: 600px;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      opacity: 0.92;
      filter: saturate(0.85) brightness(1.05) sepia(0.08);
    }

    /* Gradient fade from cream into illustration */
    .grove-fade {
      position: absolute;
      right: 0;
      top: 0;
      width: 600px;
      height: 100%;
      background: linear-gradient(to right, #fbf7ea 0%, rgba(251,247,234,0.72) 32%, rgba(251,247,234,0.15) 55%, rgba(251,247,234,0) 70%);
      pointer-events: none;
    }

    /* Top + bottom vignette */
    .grove-vignette {
      position: absolute;
      right: 0;
      top: 0;
      width: 600px;
      height: 100%;
      background:
        linear-gradient(to bottom, #fbf7ea 0%, transparent 16%, transparent 65%, #fbf7ea 88%);
      pointer-events: none;
    }

    /* Right edge fade */
    .grove-right-fade {
      position: absolute;
      right: 0;
      top: 0;
      width: 60px;
      height: 100%;
      background: linear-gradient(to left, #fbf7ea 0%, transparent 100%);
      pointer-events: none;
    }

    /* Warm cream wash over the whole illustration to unify with background */
    .grove-wash {
      position: absolute;
      right: 0;
      top: 0;
      width: 600px;
      height: 100%;
      background: rgba(251, 247, 234, 0.12);
      pointer-events: none;
    }

    /* ── Content ── */
    .content {
      position: absolute;
      inset: 0;
      padding: 52px 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      image-rendering: auto;
    }

    .wordmark {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: #171714;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .main {
      max-width: 590px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(255, 207, 73, 0.22);
      border: 1px solid rgba(156, 100, 19, 0.28);
      border-radius: 999px;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #9c6413;
      letter-spacing: 0.01em;
      margin-bottom: 22px;
    }

    .headline {
      font-family: 'Outfit', sans-serif;
      font-size: 66px;
      font-weight: 800;
      color: #171714;
      line-height: 1.06;
      letter-spacing: -0.03em;
    }

    .headline em {
      font-style: normal;
      color: #437648;
    }

    .footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .url {
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      color: rgba(101, 95, 83, 0.55);
      letter-spacing: 0.04em;
      font-weight: 500;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 16px;
      background: #fff4cf;
      border: 1px solid #e1d8c6;
      border-radius: 999px;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #9c6413;
    }

    .badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffcf49;
      flex-shrink: 0;
    }

    /* ── Controls (outside card) ── */
    .controls {
      display: none;
    }
  </style>
</head>
<body>

  <div id="card">
    <img class="grove" src="public/mango-trees.png" alt="">
    <div class="grove-wash"></div>
    <div class="grove-fade"></div>
    <div class="grove-vignette"></div>
    <div class="grove-right-fade"></div>

    <div class="content">
      <!-- Brand -->
      <div class="brand">
        <img src="public/kery.png" alt="kery logo">
        <span class="wordmark">Kery</span>
      </div>

      <!-- Eyebrow + Headline -->
      <div class="main">
        <div class="eyebrow">Browser QA for teams shipping with AI</div>
        <h1 class="headline">AI builds fast.<br>Kery tests at<br><em>that speed.</em></h1>
      </div>

      <!-- Footer -->
      <div class="footer-row">
        <span class="url">kery.dev</span>
        <span class="badge">AI browser testing</span>
      </div>
    </div>
  </div>

  <div class="controls">
    <span class="hint">Screenshot the card above, or →</span>
    <button class="btn-download" onclick="downloadCard()">Download PNG</button>
  </div>

  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <script>
    async function downloadCard() {
      const btn = document.querySelector('.btn-download');
      btn.textContent = 'Generating…';
      btn.disabled = true;
      try {
        const card = document.getElementById('card');
        const canvas = await html2canvas(card, {
          width: 1200,
          height: 630,
          scale: 1,
          useCORS: true,
          allowTaint: true,
          backgroundColor: '#fbf7ea',
          logging: false,
        });
        const link = document.createElement('a');
        link.download = 'kery-og.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      } finally {
        btn.textContent = 'Download PNG';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
